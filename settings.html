<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Codenotch Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <!-- Undecorated, so the panel is the same object language as the notch.
         The header is the drag handle Windows would otherwise have given it. -->
    <header data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>Codenotch</span>
      <button id="close" title="Close" aria-label="Close">×</button>
    </header>

    <main>
      <section>
        <h2>Task notch</h2>
        <p class="hint">Your TickTick tasks, beside your desktop.</p>
        <button class="wide" id="tasks">Tasks &amp; TickTick settings…</button>
      </section>
      <section>
        <h2>Edge</h2>
        <p class="hint">Which screen edge the notch is welded to.</p>
        <div class="edges" id="edges">
          <button data-edge="top">Top</button>
          <button data-edge="right">Right</button>
          <button data-edge="bottom">Bottom</button>
          <button data-edge="left">Left</button>
        </div>
      </section>

      <section>
        <h2>Position</h2>
        <p class="hint">Drag the notch along its edge to move it.</p>
        <button class="wide" id="reset">Reset to centre</button>
      </section>

      <section>
        <h2>Startup</h2>
        <p class="hint">Launch Codenotch when you sign in to Windows.</p>
        <button class="wide" id="autostart" aria-pressed="false">
          Start with Windows
        </button>
      </section>

      <section>
        <h2>Providers</h2>
        <p class="hint" id="providers">Reading…</p>
      </section>

      <section class="last">
        <button class="wide danger" id="quit">Quit Codenotch</button>
      </section>
    </main>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>

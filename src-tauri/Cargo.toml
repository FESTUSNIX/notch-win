[package]
name = "codenotch"
version = "0.1.0"
description = "Codenotch for Windows"
edition = "2021"

[lib]
name = "codenotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
# Default features pull rustls + aws-lc-sys, which needs NASM and CMake on
# Windows. native-tls is schannel here — already present, nothing to install.
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "charset", "native-tls"] }
base64 = "0.23.1"
windows-registry = "0.6.1"
